name: Validate skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install the Agent Skills reference validator
        run: |
          python3 -m venv .venv
          .venv/bin/pip install 'skills-ref @ git+https://github.com/agentskills/agentskills.git@83021e2be457a9b6679148719c1f6074f0ad975e#subdirectory=skills-ref'
      - name: Check skill format, links and tests
        run: |
          .venv/bin/skills-ref validate skills/medical-affairs-workflows
          python3 tools/check_links.py
          python3 -m unittest discover -s tests -v
          python3 tools/package_skill.py
